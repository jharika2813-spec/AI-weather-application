<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="container">
      <h1>Weather AI</h1>
      <p class="subtitle">Current weather with useful, AI-powered advice.</p>
      <form id="weather-form">
        <label for="city">City</label>
        <div class="search-row">
          <input id="city" name="city" placeholder="e.g. Hyderabad" required autocomplete="off">
          <button type="submit">Search</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <section id="weather-card" class="card" hidden aria-live="polite">
        <div class="heading"><h2 id="place"></h2><img id="icon" alt=""></div>
        <p class="temperature"><span id="temperature"></span>°C</p>
        <p id="condition"></p>
        <dl>
          <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
          <div><dt>Humidity</dt><dd id="humidity"></dd></div>
          <div><dt>Wind</dt><dd id="wind"></dd></div>
        </dl>
        <button id="advice-button" type="button">Get AI advice</button>
        <p id="advice" class="advice"></p>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
